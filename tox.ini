[tox]
skipsdist = true
envlist =
    lint,
    py310-odfdo{3140,3145},
    py311-odfdo{3140,3145},
    py312-odfdo{3140,3145},
    py313-odfdo{3140,3145},
    py314-odfdo{3168,3170,3230}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, lint

[testenv:py{310,311,312,313,314}-odfdo{3140,3145,3168,3170,3230}]
passenv = PYTHON_VERSION
deps =
    odfdo3140: odfdo==3.14.0
    odfdo3145: odfdo==3.14.5
    odfdo3168: odfdo==3.16.8
    odfdo3170: odfdo==3.17.0
    odfdo3230: odfdo==3.23.0
setenv =
  LC_ALL=C.UTF-8
allowlist_externals = uv, pytest
commands =
    pytest

[testenv:lint]
allowlist_externals = ruff
commands =
    ruff check src
