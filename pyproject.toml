[project]
name = "odsparsator"
version = "1.17.0"
description = "Generate a json file from an OpenDocument Format .ods file"
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
authors = [{ name = "Jérôme Dumonteil", email = "jerome.dumonteil@gmail.com" }]
keywords = ["openDocument", "ODF", "ods", "json", "spreadsheet", "parser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10, <4"
dependencies = ["odfdo>=3.27.3"]

[project.urls]
Homepage = "https://github.com/jdum/odsparsator"
Repository = "https://github.com/jdum/odsparsator"

[project.scripts]
odsparsator = "odsparsator.cli:main"

[dependency-groups]
doc = [
    "sphinx>=7.0",
    "myst-parser>=4.0.1",
    "roman-numerals-py!=4.1.0",
]

dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "coverage>=7.16.1",
    "typing-extensions>=4.15.0",
    "tox>=4.63.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv]
default-groups = ["doc", "dev"]

[tool.uv.build-backend]
source-exclude = [".DS_Store"]

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = ["tests"]

[tool.ruff]
target-version = "py310"
exclude = [".venv"]
# Same as Black.
line-length = 88
indent-width = 4
fix = false

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Use specific rule codes when ignoring type issues
    "PGH003",
    # check for execution of untrusted input
    "S603",
    # Class attribute `open` is shadowing a Python builtin
    "A003",
    # Avoid specifying long messages outside the exception class
    "TRY003",
    # Use ternary operator
    "SIM108",
    # Use of `assert` detected
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_*" = ["S101"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["odsparsator"]
